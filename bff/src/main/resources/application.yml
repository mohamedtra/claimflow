# Configuration commune. Les valeurs propres à chaque environnement (URL, comptes, secrets) sont
# fournies par variables d'environnement : aucune valeur de production dans le dépôt.
spring:
  application:
    name: claimflow-bff
  datasource:
    url: ${DB_URL:}
    username: ${DB_USER:}
    password: ${DB_PASSWORD:}
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: claimflow-bff
            client-secret: ${OIDC_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid,profile,email
        # Le fournisseur « keycloak » (issuer-uri, ou adresses explicites) est donné par chaque
        # environnement. Sans lui, le BFF refuse de démarrer : c'est voulu.
  session:
    timeout: 30m
    jdbc:
      # Les tables sont créées par Flyway (V1__sessions.sql), jamais par l'application.
      initialize-schema: never

claimflow:
  bff:
    adresse-api: ${API_URL}
    adresse-spa: ${SPA_URL}

server:
  shutdown: graceful
  # Derrière nginx et CloudFront : l'adresse de retour OIDC doit être l'adresse publique en HTTPS.
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
