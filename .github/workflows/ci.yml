name: CI

# Chaîne d'intégration (section 3.10 du dossier projet). Chaque contrôle est bloquant :
# la protection de la branche main exige que tous ces jobs soient verts avant une fusion.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  commits:
    name: Messages de commit
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Conventional Commits
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: npx commitlint --from "$BASE" --to "$HEAD" --verbose

  contrat-api:
    name: Contrat d'API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Règles du contrat (Spectral)
        run: npm run lint:api
      - name: Contrat de la branche cible
        id: base
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if git show "origin/${BASE_REF}:docs/openapi/claimflow.yaml" > base-claimflow.yaml 2>/dev/null; then
            echo "existe=true" >> "$GITHUB_OUTPUT"
          else
            echo "Pas de contrat sur la branche cible : comparaison ignorée."
            echo "existe=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Changements incompatibles (oasdiff)
        if: steps.base.outputs.existe == 'true'
        uses: oasdiff/oasdiff-action/breaking@v0.1.4
        with:
          base: base-claimflow.yaml
          revision: docs/openapi/claimflow.yaml
          fail-on: ERR

  api:
    name: API · tests et qualité
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Tests unitaires, d'architecture et d'intégration (Testcontainers)
        run: mvn -B -f api/pom.xml verify
      - name: Analyse SonarQube Cloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: env.SONAR_TOKEN != ''
        run: >-
          mvn -B -f api/pom.xml org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.qualitygate.wait=true
      - name: Rapports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-api
          path: |
            api/target/site/jacoco-merged/
            api/target/spring-modulith-docs/
            api/target/surefire-reports/
            api/target/failsafe-reports/
          if-no-files-found: ignore

  web:
    name: SPA · lint, types, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Types TypeScript à jour avec le contrat d'API
        run: |
          npm run generate:api
          git diff --exit-code -- src/api/schema.d.ts \
            || { echo "::error::src/api/schema.d.ts est obsolète : lancer « npm run generate:api »."; exit 1; }
      - run: npm run lint
      - run: npm run type-check
      - run: npm test
      - run: npm run build

  securite:
    name: Secrets et dépendances
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Secrets (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Dépendances vulnérables (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

  images:
    name: Image ${{ matrix.composant }}
    needs: [api, web, securite]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - composant: api
            contexte: .
            dockerfile: api/Dockerfile
          - composant: web
            contexte: web
            dockerfile: web/Dockerfile
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Nom de l'image
        id: nom
        env:
          DEPOT: ${{ github.repository }}
          COMPOSANT: ${{ matrix.composant }}
        run: echo "image=ghcr.io/${DEPOT,,}-${COMPOSANT}" >> "$GITHUB_OUTPUT"
      - name: Construction
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.contexte }}
          file: ${{ matrix.dockerfile }}
          load: true
          tags: ${{ steps.nom.outputs.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.composant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.composant }}
      - name: Vulnérabilités de l'image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.nom.outputs.image }}:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Connexion au registre
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Construire une fois, déployer partout : l'image est identifiée par le commit, puis par son
      # empreinte. Les environnements dev, rct et prod déploieront cette même image (section 3.11).
      - name: Publication
        if: github.event_name == 'push'
        env:
          IMAGE: ${{ steps.nom.outputs.image }}
          SHA: ${{ github.sha }}
        run: docker push "${IMAGE}:${SHA}"
