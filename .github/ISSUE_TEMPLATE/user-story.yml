name: User story
description: Un besoin d'utilisateur, livrable en un sprint
title: "US-XX · "
labels: ["type:us"]
body:
  - type: textarea
    id: recit
    attributes:
      label: Récit
      description: En tant que…, je veux…, afin de…
      placeholder: En tant qu'assurée, je veux déclarer un sinistre en ligne afin d'être indemnisée sans appeler.
    validations:
      required: true
  - type: textarea
    id: criteres
    attributes:
      label: Critères d'acceptation (Gherkin)
      render: gherkin
      placeholder: |
        Scénario: …
          Étant donné que …
          Quand …
          Alors …
    validations:
      required: true
  - type: input
    id: regles
    attributes:
      label: Règles de gestion
      placeholder: RG-01, RG-07
  - type: input
    id: ecran
    attributes:
      label: Écran de la maquette
      placeholder: Écran 03, ou « à concevoir »
  - type: dropdown
    id: priorite
    attributes:
      label: Priorité
      options: [Must, Should, Could]
    validations:
      required: true
  - type: checkboxes
    id: pret
    attributes:
      label: Définition de « prêt »
      options:
        - label: Respecte INVEST et tient dans un sprint (8 points au maximum)
        - label: Critères vérifiables, règles citées, écran référencé
        - label: Dépendances identifiées et levées
