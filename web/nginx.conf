server {
    listen 8080;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'" always;

    # Les appels API passent par le BFF (sprint 1) ; en attendant, vers l'API.
    location /api/ {
        proxy_pass http://api:8080;
    }
    location /actuator/health {
        proxy_pass http://api:8080;
    }

    # SPA : toute route inconnue renvoie index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
