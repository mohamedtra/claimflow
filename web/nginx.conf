server {
    listen 8080;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'" always;

    # Image servie en conteneur : les routes vers le BFF arrivent à l'étape 6 (mise en service en dev).
    # En attendant, la SPA se lance en local avec « make web », qui passe par le BFF.
    location /api/ {
        proxy_pass http://api:8080;
    }
    location /actuator/health {
        proxy_pass http://api:8080;
    }

    # SPA : toute route inconnue renvoie index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
