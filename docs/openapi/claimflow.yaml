          format: date-time
        acteurId:
          type: string
        acteurRole:
          type: string
        action:
          type: string
        objetType:
          type: string
        objetId:
          type: string
          format: uuid
        avant:
          type: object
          nullable: true
          additionalProperties: true
        apres:
          type: object
          nullable: true
          additionalProperties: true

