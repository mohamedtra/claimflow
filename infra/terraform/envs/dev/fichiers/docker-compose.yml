# Pile ClaimFlow sur l'instance EC2 (dev). Lancée par deployer.sh avec le fichier .env qu'il génère
# (mots de passe lus dans SSM, version de l'API, adresse publique). Ne pas lancer à la main.
name: claimflow

x-journaux: &journaux
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      CLAIMFLOW_PASSWORD: ${CLAIMFLOW_PASSWORD:?}
      CLAIMFLOW_APP_PASSWORD: ${CLAIMFLOW_APP_PASSWORD:?}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?}
    volumes:
      - /srv/claimflow/donnees/postgres:/var/lib/postgresql
      - ./config/init-postgres.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 30
    mem_limit: 256m
    <<: *journaux

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.5
    restart: unless-stopped
    command: ["start", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?}
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?}
      # Derrière CloudFront et nginx, sous /auth. La console d'administration n'est pas publiée :
      # on y accède par un tunnel SSM vers le port 8180 de l'instance (docs/runbooks/aws-demarrage.md).
      KC_HOSTNAME: ${URL_PUBLIQUE:?}/auth
      KC_HOSTNAME_ADMIN: http://localhost:8180/auth
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:8180:8080"
    volumes:
      - ./config/claimflow-realm.json:/opt/keycloak/data/import/claimflow-realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 768m
    <<: *journaux

  api:
    image: ghcr.io/mohamedtra/claimflow-api:${VERSION_API:-dev}
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/claimflow
      SPRING_DATASOURCE_USERNAME: claimflow_app
      SPRING_DATASOURCE_PASSWORD: ${CLAIMFLOW_APP_PASSWORD:?}
      SPRING_FLYWAY_USER: claimflow
      SPRING_FLYWAY_PASSWORD: ${CLAIMFLOW_PASSWORD:?}
      # dev présente le jeu de démonstration fictif ; jamais en rct ni en prod.
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration,classpath:db/demo
      SERVER_FORWARD_HEADERS_STRATEGY: framework
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 640m
    <<: *journaux

  proxy:
    image: nginxinc/nginx-unprivileged:1.30-alpine
    restart: unless-stopped
    ports:
      - "80:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - keycloak
    mem_limit: 64m
    <<: *journaux
