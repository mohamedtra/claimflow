# Pile ClaimFlow sur l'instance EC2 (dev). Lancée par deployer.sh avec le fichier .env qu'il génère
# (mots de passe lus dans SSM, versions de l'API et du BFF, adresse publique). Ne pas lancer à la main.
#
# Mémoire : l'instance a 2 Gio (t3.small, offre gratuite) et 2 Gio d'échange. Les limites ci-dessous
# plafonnent chaque service ; les deux outils de configuration de Keycloak ne tournent que pendant
# un déploiement.
name: claimflow

x-journaux: &journaux
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      CLAIMFLOW_PASSWORD: ${CLAIMFLOW_PASSWORD:?}
      CLAIMFLOW_APP_PASSWORD: ${CLAIMFLOW_APP_PASSWORD:?}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?}
    volumes:
      - /srv/claimflow/donnees/postgres:/var/lib/postgresql
      - ./config/init-postgres.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 30
    mem_limit: 256m
    <<: *journaux

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.5
    restart: unless-stopped
    # Le realm n'est plus importé au démarrage : keycloak-config l'applique (ADR-016).
    command: ["start"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?}
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?}
      # Derrière CloudFront et nginx, sous /auth. La console d'administration n'est pas publiée :
      # on y accède par un tunnel SSM vers le port 8180 de l'instance (docs/runbooks/aws-demarrage.md).
      KC_HOSTNAME: ${URL_PUBLIQUE:?}/auth
      KC_HOSTNAME_ADMIN: http://localhost:8180/auth
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:8180:8080"
    # L'image n'a pas curl : Keycloak est prêt quand le realm master répond 200.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080
          && printf 'GET /auth/realms/master HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3
          && head -1 <&3 | grep -q ' 200'
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 640m
    <<: *journaux

  # Applique le realm (infra/keycloak/realm) à chaque déploiement, puis s'arrête (ADR-016). Les
  # adresses sont celles de CloudFront : SPA et BFF y partagent la même origine.
  keycloak-config:
    image: adorsys/keycloak-config-cli:6.5.1-26.5.5
    restart: "no"
    environment:
      KEYCLOAK_URL: http://keycloak:8080/auth
      KEYCLOAK_USER: admin
      KEYCLOAK_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?}
      KEYCLOAK_AVAILABILITYCHECK_ENABLED: "true"
      KEYCLOAK_AVAILABILITYCHECK_TIMEOUT: 180s
      IMPORT_FILES_LOCATIONS: /config/*
      IMPORT_VARSUBSTITUTION_ENABLED: "true"
      REALM_URL_BFF: ${URL_PUBLIQUE:?}
      REALM_URL_SPA: ${URL_PUBLIQUE:?}
      REALM_SECRET_BFF: ${SECRET_CLIENT_BFF:?}
      # Pas d'envoi d'e-mails en dev (décision D3) : mot de passe oublié désactivé.
      REALM_SMTP_HOTE: localhost
      REALM_SMTP_PORT: "25"
      REALM_SMTP_EXPEDITEUR: ne-pas-repondre@claimflow.test
      REALM_MOT_DE_PASSE_OUBLIE: "false"
    volumes:
      - ./config/realm:/config:ro
    depends_on:
      keycloak:
        condition: service_healthy
    mem_limit: 384m
    <<: *journaux

  # Comptes de démonstration fictifs, à identifiants fixes : local et dev seulement (ADR-016).
  keycloak-demo:
    image: quay.io/keycloak/keycloak:26.7.5
    restart: "no"
    entrypoint: ["/bin/bash", "/demo/importer.sh"]
    environment:
      KEYCLOAK_URL: http://keycloak:8080/auth
      KEYCLOAK_USER: admin
      KEYCLOAK_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?}
    volumes:
      - ./config/demo:/demo:ro
    depends_on:
      keycloak-config:
        condition: service_completed_successfully
    mem_limit: 256m
    <<: *journaux

  api:
    image: ghcr.io/mohamedtra/claimflow-api:${VERSION_API:-dev}
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/claimflow
      SPRING_DATASOURCE_USERNAME: claimflow_app
      SPRING_DATASOURCE_PASSWORD: ${CLAIMFLOW_APP_PASSWORD:?}
      SPRING_FLYWAY_USER: claimflow
      SPRING_FLYWAY_PASSWORD: ${CLAIMFLOW_PASSWORD:?}
      # dev présente le jeu de démonstration fictif ; jamais en rct ni en prod.
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration,classpath:db/demo
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      # Validation des jetons (ADR-002) : émetteur public, clés lues en interne.
      OIDC_ISSUER_URI: ${URL_PUBLIQUE:?}/auth/realms/claimflow
      OIDC_JWK_SET_URI: http://keycloak:8080/auth/realms/claimflow/protocol/openid-connect/certs
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 512m
    <<: *journaux

  # Seul point d'entrée du navigateur (ADR-003). Il découvre Keycloak par son adresse publique, la
  # même que celle écrite dans les jetons : la découverte passe donc par CloudFront et nginx.
  bff:
    image: ghcr.io/mohamedtra/claimflow-bff:${VERSION_BFF:-dev}
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/bff
      DB_USER: bff
      DB_PASSWORD: ${BFF_DB_PASSWORD:?}
      OIDC_CLIENT_SECRET: ${SECRET_CLIENT_BFF:?}
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_ISSUER_URI: ${URL_PUBLIQUE:?}/auth/realms/claimflow
      API_URL: http://api:8080
      SPA_URL: ${URL_PUBLIQUE:?}/
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak-config:
        condition: service_completed_successfully
      proxy:
        condition: service_started
    mem_limit: 448m
    <<: *journaux

  proxy:
    image: nginxinc/nginx-unprivileged:1.30-alpine
    restart: unless-stopped
    ports:
      - "80:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - keycloak
    mem_limit: 64m
    <<: *journaux
