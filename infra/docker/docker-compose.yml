# Environnement local ClaimFlow (section 3.11). Toutes les valeurs sont des valeurs de développement.
#   docker compose up -d                 infrastructure seule (API et SPA lancées depuis l'IDE)
#   docker compose --profile app up -d   pile complète en conteneurs
name: claimflow

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres-dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.5
    command: [ "start-dev" ]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak-dev
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_PORT: "8180"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8180:8180"
    # L'image n'a pas curl : la santé est lue sur le port de gestion (9000) avec bash.
    healthcheck:
      test: [ "CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3" ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy

  # Applique infra/keycloak/realm à chaque démarrage (ADR-016), puis s'arrête.
  keycloak-config:
    image: adorsys/keycloak-config-cli:6.5.1-26.5.5
    environment:
      KEYCLOAK_URL: http://keycloak:8180
      KEYCLOAK_USER: admin
      KEYCLOAK_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KEYCLOAK_AVAILABILITYCHECK_ENABLED: "true"
      KEYCLOAK_AVAILABILITYCHECK_TIMEOUT: 120s
      IMPORT_FILES_LOCATIONS: /config/*
      IMPORT_VARSUBSTITUTION_ENABLED: "true"
      REALM_URL_BFF: http://localhost:8081
      REALM_URL_SPA: http://localhost:5173
      REALM_SECRET_BFF: claimflow-bff-local
      REALM_SMTP_HOTE: mailpit
      REALM_SMTP_PORT: "1025"
      REALM_SMTP_EXPEDITEUR: ne-pas-repondre@claimflow.test
      REALM_MOT_DE_PASSE_OUBLIE: "true"
    volumes:
      - ../keycloak/realm:/config:ro
    depends_on:
      keycloak:
        condition: service_healthy

  # Comptes de démonstration à identifiants fixes, importés après le realm (local et dev seulement).
  keycloak-demo:
    image: quay.io/keycloak/keycloak:26.7.5
    entrypoint: [ "/bin/bash", "/demo/importer.sh" ]
    environment:
      KEYCLOAK_URL: http://keycloak:8180
      KEYCLOAK_USER: admin
      KEYCLOAK_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    volumes:
      - ../keycloak/demo:/demo:ro
    depends_on:
      keycloak-config:
        condition: service_completed_successfully

  # Stockage objet compatible S3. Les images officielles MinIO ne sont plus publiées depuis
  # octobre 2025 : on utilise l'image gratuite maintenue par Chainguard (ADR-008).
  stockage:
    image: cgr.dev/chainguard/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${STOCKAGE_UTILISATEUR:-claimflow}
      MINIO_ROOT_PASSWORD: ${STOCKAGE_MOT_DE_PASSE:-claimflow-dev}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - stockage-data:/data

  mailpit:
    image: axllent/mailpit:v1.31.1
    ports:
      - "1025:1025"
      - "8025:8025"

  clamav:
    image: clamav/clamav:1.4
    ports:
      - "3310:3310"
    volumes:
      - clamav-signatures:/var/lib/clamav

  api:
    profiles: ["app"]
    build:
      context: ../..
      dockerfile: api/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/claimflow
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8180/realms/claimflow/protocol/openid-connect/certs
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    profiles: ["app"]
    build:
      context: ../../web
    ports:
      - "5173:8080"
    depends_on:
      - api

volumes:
  postgres-data:
  stockage-data:
  clamav-signatures:
